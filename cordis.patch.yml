# dsh-plugin-focus-session — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "focus".
# Tools resultantes: mcp__focus__* (ver README).
- insert:
    - id: mcp-focus-session
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: focus
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/focus-session/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
